name: CI

on:
  push:
    branches: [main]
  pull_request:

# One job per platform. The two engines share no code and drift on purpose, so a failure should
# name the platform that broke rather than send anyone reading a matrix.
jobs:
  joomla:
    runs-on: ubuntu-latest
    # The Joomla component installed on a customer's own site.
    defaults:
      run:
        working-directory: joomla/cowork
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # 8.1 is the floor Joomla 5 itself sets, so it is the floor this has to run on.
      - name: Lint every PHP file
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Engine tests
        run: php tests/run.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # After the build, not before: a language check that only sees source files cannot see
      # what a build step generates, and generated strings are exactly where this slipped once.
      - name: Build the package
        run: ./build.sh

      # After the build: the last case reads the real package, which needs the engine copy build.sh makes.
      # The four build scripts share the generator, so this one job holds it for all of them.
      - name: Release manifest generator
        run: node --test ../../scripts/release-manifest.test.mjs

      # After the build too: the last case checks the component carries no profile and every
      # dist/contracts asset matches the index the component ships (TCH #1568).
      - name: Contract profile assets
        run: node --test ../../scripts/contract-assets.test.mjs

      - name: Language check
        run: node ../../scripts/check-language.mjs com_claudecowork/administrator/lib

  wordpress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress/cowork
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # The same 8.1 the Joomla job uses. WordPress itself still runs on older PHP, so the floor
      # this plugin must parse on is a decision nobody has made — until it is, do not imply one.
      - name: Lint every PHP file
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Engine tests
        run: php tests/run.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the package
        run: ./build.sh

      - name: Language check
        run: node ../../scripts/check-language.mjs claude-cowork/lib

  # The floor both packages declare: `requires_php` 7.4 in joomla/update.json and wordpress/update.json.
  # The jobs above run 8.1, which parses a nullsafe `?->` and calls str_starts_with without a word, so
  # 0.24.38 carried an engine a PHP 7 site could not even parse: every call answered HTTP 500. Every PHP file is
  # linted here, tests included; the Joomla engine tests run too, because a PHP 8 function called on
  # 7.4 is no parse error — it is a fatal error at the line that calls it.
  php74:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Lint every PHP file of the Joomla package
        run: find joomla/cowork -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint every PHP file of the WordPress plugin
        run: find wordpress/cowork -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Joomla engine tests
        run: php tests/run.php
        working-directory: joomla/cowork

  # The look a Tracy site is built in: one Joomla template and one WordPress theme, each mirrored
  # here from the repository that generates them. Nothing is compiled here, so the job asks the two
  # questions a mirror can still get wrong — does every PHP file parse, and does the zip assemble
  # with all 152 design inspirations in it.
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint the template's PHP
        run: find joomla/template/tpl_tracy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint the theme's PHP
        run: find wordpress/theme/tracy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build the template package
        run: ./build.sh
        working-directory: joomla/template

      - name: Build the theme package
        run: ./build.sh
        working-directory: wordpress/theme

      - name: Language check
        run: node scripts/check-language.mjs joomla/template/tpl_tracy wordpress/theme/tracy

