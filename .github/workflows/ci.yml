name: CI

on:
  push:
    branches: [main]
  pull_request:

# One job per platform. The two engines share no code and drift on purpose, so a failure should
# name the platform that broke rather than send anyone reading a matrix.
jobs:
  joomla:
    runs-on: ubuntu-latest
    # The Joomla component installed on a customer's own site.
    defaults:
      run:
        working-directory: joomla/cowork
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # 8.1 is the floor Joomla 5 itself sets, so it is the floor this has to run on.
      - name: Lint every PHP file
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Engine tests
        run: php tests/run.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # After the build, not before: a language check that only sees source files cannot see
      # what a build step generates, and generated strings are exactly where this slipped once.
      - name: Build the package
        run: ./build.sh

      - name: Language check
        run: node ../../scripts/check-language.mjs com_claudecowork/administrator/lib

  wordpress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress/cowork
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # The same 8.1 the Joomla job uses. WordPress itself still runs on older PHP, so the floor
      # this plugin must parse on is a decision nobody has made — until it is, do not imply one.
      - name: Lint every PHP file
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Engine tests
        run: php tests/run.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the package
        run: ./build.sh

      - name: Language check
        run: node ../../scripts/check-language.mjs claude-cowork/lib

  # The look a Tracy site is built in: one Joomla template and one WordPress theme, each mirrored
  # here from the repository that generates them. Nothing is compiled here, so the job asks the two
  # questions a mirror can still get wrong — does every PHP file parse, and does the zip assemble
  # with all 152 design inspirations in it.
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint the template's PHP
        run: find joomla/template/tpl_tracy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint the theme's PHP
        run: find wordpress/theme/tracy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build the template package
        run: ./build.sh
        working-directory: joomla/template

      - name: Build the theme package
        run: ./build.sh
        working-directory: wordpress/theme

      - name: Language check
        run: node scripts/check-language.mjs joomla/template/tpl_tracy wordpress/theme/tracy

