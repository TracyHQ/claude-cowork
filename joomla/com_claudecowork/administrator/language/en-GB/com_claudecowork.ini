COM_CLAUDECOWORK="Tracy Claude Cowork"
COM_CLAUDECOWORK_XML_DESCRIPTION="<p><strong>A coworker for your Joomla site.</strong> It gives an AI assistant one safe way to read this site &mdash; its database, its files and what is installed &mdash; with no shell access, no FTP account and no database port open to the internet.</p><p><strong>This extension only reads, and always will.</strong> Every action it offers returns data; none of them changes a row, a file or a setting. That is a design decision, not a current limitation: publishing back to your site is a separate door with its own credential, and it does not pass through here. A token stolen from this extension cannot alter your site.</p><p><strong>Your site gains a history.</strong> What it reads is committed to a git repository your team owns, so every change &mdash; a new article, an edited page, a template tweak &mdash; is something you can read, compare against last week and roll back.</p><p><strong>Going live stays your decision.</strong> Coworkers draft and review in that repository; only an administrator can approve what reaches the running site, and it gets there through Joomla&rsquo;s own API rather than through this extension.</p><p><strong>Built for real hosting.</strong> It never shells out and never calls mysqldump, because shared hosts disable both. Work arrives in bounded pieces with a cursor, so a site of any size finishes even where PHP is stopped after thirty seconds. The endpoint is plain HTTP behind a token, so Claude, ChatGPT, Gemini or an assistant you built yourself all use it the same way &mdash; the name is for the way of working, not the vendor.</p><p>Inert until you set a token: while that setting is empty every request is refused. Source code: <a href="https://github.com/TracyHQ/claude-cowork" target="_blank" rel="noopener">github.com/TracyHQ/claude-cowork</a></p><p><em>Claude is a trademark of Anthropic PBC. This extension is built by Tracy and is not affiliated with, endorsed by or sponsored by Anthropic.</em></p>"
COM_CLAUDECOWORK_CONFIG_TOKEN_LABEL="Access token"
COM_CLAUDECOWORK_CONFIG_TOKEN_DESC="A token was generated when this was installed. Copy it into Tracy to pair this site. Clear it to revoke access: while it is empty every request is refused."
COM_CLAUDECOWORK_CONFIG_WEBROOT_LABEL="Webroot path"
COM_CLAUDECOWORK_CONFIG_WEBROOT_DESC="Leave empty to use this site's own root. Only set this if the files to read live somewhere else."
COM_CLAUDECOWORK_CONNECT_INTRO="Copy this token into Tracy to connect this site. It is the only thing Tracy needs — no admin login is handed over."
COM_CLAUDECOWORK_CONNECT_NO_TOKEN="This site has no token yet. Reinstall the component to generate one, or set one in Options."
COM_CLAUDECOWORK_CONNECT_COPY="Copy"
COM_CLAUDECOWORK_CONNECT_COPIED="Copied"
COM_CLAUDECOWORK_CONNECT_TOKEN_HINT="Anyone with this token can read the site. Clear it in Options to revoke access."
