COM_CLAUDECOWORK="Tracy Claude Cowork"
COM_CLAUDECOWORK_XML_DESCRIPTION="<p><strong>A coworker for your Joomla site.</strong> It gives an AI assistant one safe way to read this site &mdash; its database, its files and what is installed &mdash; with no shell access, no FTP account and no database port open to the internet.</p><p><strong>Every change is one you asked for.</strong> It reads the site &mdash; its database, its files, what is installed &mdash; and it installs the extensions you approve. Nothing runs on its own: there is no shell, no arbitrary file write, and no action that is not named and bounded. Clearing the token in Options revokes all of it at once.</p><p><strong>Your site gains a history.</strong> What it reads is committed to a git repository your team owns, so every change &mdash; a new article, an edited page, a template tweak &mdash; is something you can read, compare against last week and roll back.</p><p><strong>Going live stays your decision.</strong> Coworkers draft and review in that repository; only an administrator can approve what reaches the running site, and it gets there through Joomla&rsquo;s own API rather than through this extension.</p><p><strong>Built for real hosting.</strong> It never shells out and never calls mysqldump, because shared hosts disable both. Work arrives in bounded pieces with a cursor, so a site of any size finishes even where PHP is stopped after thirty seconds. The endpoint is plain HTTP behind a token, so Claude, ChatGPT, Gemini or an assistant you built yourself all use it the same way &mdash; the name is for the way of working, not the vendor.</p><p>Inert until you set a token: while that setting is empty every request is refused. Source code: <a href="https://github.com/TracyHQ/claude-cowork" target="_blank" rel="noopener">github.com/TracyHQ/claude-cowork</a></p><p><em>Claude is a trademark of Anthropic PBC. This extension is built by Tracy and is not affiliated with, endorsed by or sponsored by Anthropic.</em></p>"
COM_CLAUDECOWORK_MENU="Tracy Claude Cowork"
COM_CLAUDECOWORK_SHORT="Lets an AI assistant read your Joomla site and install what you approve. Token-gated, open source."
